limit_req_zone $binary_remote_addr zone=external_scan_app:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=external_scan_enroll:10m rate=5r/m;

server {
    listen 80;
    server_name tthih.top;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name tthih.top;

    ssl_certificate /etc/letsencrypt/live/tthih.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tthih.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 256k;

    location = /app/v1/device/register {
        limit_req zone=external_scan_enroll burst=2 nodelay;
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:18082;
        include proxy_params;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }

    location /app/v1/ {
        limit_req zone=external_scan_app burst=20 nodelay;
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:18082;
        include proxy_params;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }

    location /worker/v1/ {
        proxy_pass http://127.0.0.1:18082;
        include proxy_params;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }

    # 当前 WinServer EXE 的旧接口，升级并完成验收后再决定是否移除。
    location /api/ {
        proxy_pass http://127.0.0.1:18082;
        include proxy_params;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:18082;
        include proxy_params;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location / {
        return 404;
    }
}
