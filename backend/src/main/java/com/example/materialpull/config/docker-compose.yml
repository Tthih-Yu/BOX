services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: material-pull-backend:${APP_VERSION:-0.8.4}
    container_name: material-pull-backend
    restart: unless-stopped
    environment:
      # 默认 H2 文件库；改用 MySQL 时必须设为 mysql（例如 SPRING_PROFILES_ACTIVE=mysql 并启用 mysql profile）
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
      TZ: Asia/Shanghai
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75.0}
      # 首次部署用于创建管理员，创建成功后建议清空
      MATERIAL_PULL_BOOTSTRAP_ADMIN_PASSWORD: ${MATERIAL_PULL_BOOTSTRAP_ADMIN_PASSWORD:-}
      MATERIAL_PULL_EXTERNAL_API_KEY: ${MATERIAL_PULL_EXTERNAL_API_KEY:-CHANGE_ME_EXTERNAL_API_KEY}
      # CORS 白名单（逗号分隔），生产填实际访问域名 / IP
      MATERIAL_PULL_CORS_ALLOWED_ORIGINS: ${MATERIAL_PULL_CORS_ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1}
      # 默认 H2 文件库；切 MySQL 时请同时设置 SPRING_PROFILES_ACTIVE=mysql，避免 MySQL URL 仍使用 H2 Driver
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:h2:file:./data/material-pull;MODE=MySQL;DATABASE_TO_LOWER=TRUE}
      MATERIAL_PULL_DATASOURCE_DRIVER: ${MATERIAL_PULL_DATASOURCE_DRIVER:-org.h2.Driver}
      MYSQL_USER: ${MYSQL_USER:-material_pull}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-}
      # MySQL 首发到空库时设为 update 让 Hibernate 建表；稳态改回 validate（见 DOCKER.md 第四节）
      MATERIAL_PULL_MYSQL_DDL_AUTO: ${MATERIAL_PULL_MYSQL_DDL_AUTO:-validate}
      # 集群模式（多实例）开关；启用需配合 redis profile
      MATERIAL_PULL_CLUSTER_ENABLED: ${MATERIAL_PULL_CLUSTER_ENABLED:-false}
      MANAGEMENT_HEALTH_REDIS_ENABLED: ${MATERIAL_PULL_CLUSTER_ENABLED:-false}
      MATERIAL_PULL_REDIS_HOST: ${MATERIAL_PULL_REDIS_HOST:-redis}
      MATERIAL_PULL_REDIS_PORT: ${MATERIAL_PULL_REDIS_PORT:-6379}
      MATERIAL_PULL_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # 扫码设备加固（可选）
      MATERIAL_PULL_DEVICE_REQUIRE_KEY: ${MATERIAL_PULL_DEVICE_REQUIRE_KEY:-false}
      MATERIAL_PULL_DEVICE_KEYS: ${MATERIAL_PULL_DEVICE_KEYS:-}
      MATERIAL_PULL_DEVICE_ALLOWED_CIDRS: ${MATERIAL_PULL_DEVICE_ALLOWED_CIDRS:-}
      # 标签规格（仅首次部署空库时按此预设写入“系统参数”，之后以后台页面为准）。
      # 换 300dpi 打印机时设 MATERIAL_PULL_LABEL_DPI=300，避免标签被放大显示不全。
      MATERIAL_PULL_LABEL_DPI: ${MATERIAL_PULL_LABEL_DPI:-203}
      MATERIAL_PULL_LABEL_WIDTH_MM: ${MATERIAL_PULL_LABEL_WIDTH_MM:-35}
      MATERIAL_PULL_LABEL_HEIGHT_MM: ${MATERIAL_PULL_LABEL_HEIGHT_MM:-95}
    volumes:
      - backend-data:/app/data
      - backend-logs:/app/logs
    networks:
      - material-pull
    deploy:
      resources:
        limits:
          memory: ${BACKEND_MEM_LIMIT:-1500m}
          cpus: "${BACKEND_CPU_LIMIT:-2}"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    # 不对外暴露 8080，统一经前端 nginx 反代访问；如需直连调试可解开下一行
    # ports:
    #   - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_APP_TITLE: ${VITE_APP_TITLE:-物料拉动系统}
        VITE_APP_VERSION: ${VITE_APP_VERSION:-V0.8.4-production}
    image: material-pull-frontend:${APP_VERSION:-0.8.4}
    container_name: material-pull-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT:-80}:80"
    networks:
      - material-pull
    deploy:
      resources:
        limits:
          memory: ${FRONTEND_MEM_LIMIT:-256m}
          cpus: "${FRONTEND_CPU_LIMIT:-1}"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # 可选 MySQL：使用 `docker compose --profile mysql up -d` 启用
  mysql:
    image: mysql:8.0
    container_name: material-pull-mysql
    restart: unless-stopped
    profiles: ["mysql"]
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_change_me}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-material_pull}
      MYSQL_USER: ${MYSQL_USER:-material_pull}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-material_pull_change_me}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./deploy/mysql/init:/docker-entrypoint-initdb.d:ro
    networks:
      - material-pull
    deploy:
      resources:
        limits:
          memory: ${MYSQL_MEM_LIMIT:-1g}
          cpus: "${MYSQL_CPU_LIMIT:-2}"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10

  # 可选 Redis：集群模式（多实例）使用 `docker compose --profile redis up -d` 启用
  redis:
    image: redis:7-alpine
    container_name: material-pull-redis
    restart: unless-stopped
    profiles: ["redis"]
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-redis_change_me}"]
    environment:
      TZ: Asia/Shanghai
    volumes:
      - redis-data:/data
    networks:
      - material-pull
    deploy:
      resources:
        limits:
          memory: ${REDIS_MEM_LIMIT:-512m}
          cpus: "${REDIS_CPU_LIMIT:-1}"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_change_me}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # 可选定时备份：使用 `docker compose --profile backup up -d` 启用
  # 用轻量 shell 循环按间隔备份 MySQL 到 db-backups 卷，保留 N 天
  db-backup:
    image: mysql:8.0
    container_name: material-pull-db-backup
    restart: unless-stopped
    profiles: ["backup"]
    depends_on:
      - mysql
    environment:
      TZ: Asia/Shanghai
      BACKUP_MODE: mysql
      BACKUP_DIR: /backups
      RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      MYSQL_HOST: mysql
      MYSQL_DATABASE: ${MYSQL_DATABASE:-material_pull}
      MYSQL_USER: ${MYSQL_USER:-material_pull}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-material_pull_change_me}
      # 备份间隔秒数，默认 86400（每天一次）
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - db-backups:/backups
      - ./deploy/scripts/db-backup.sh:/usr/local/bin/db-backup.sh:ro
    networks:
      - material-pull
    entrypoint: ["sh", "-c"]
    command:
      - |
        echo "[db-backup] 启动，间隔 $$BACKUP_INTERVAL_SECONDS 秒，保留 $$RETENTION_DAYS 天"
        # 先等 MySQL 就绪
        sleep 30
        while true; do
          sh /usr/local/bin/db-backup.sh >> /backups/backup.log 2>&1 || echo "[db-backup] 本轮失败，见 backup.log"
          sleep "$$BACKUP_INTERVAL_SECONDS"
        done

volumes:
  backend-data:
  backend-logs:
  mysql-data:
  redis-data:
  db-backups:

networks:
  material-pull:
    driver: bridge
