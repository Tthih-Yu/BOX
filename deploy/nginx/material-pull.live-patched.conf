# 物料拉动系统 - 原生 Nginx 部署配置（80 端口对外入口）
# 部署到: /etc/nginx/sites-available/material-pull.conf
# 前端静态文件: /home/tthih/IE/frontend/dist
# 后端: 本机 127.0.0.1:8080 (java -jar, context-path=/api)
# 前后端同源，无需 CORS。

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /home/tthih/IE/frontend/dist;
    index index.html;

    client_max_body_size 512m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer-when-downgrade always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' ws: wss:; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ===== 独立项目：Excel 工具（静态） =====
    # 文件位于 /home/tthih/tools，与物料拉动系统完全隔离。
    # 访问 http://<IP>/tools/
    # ^~ 让本前缀优先于下方的静态资源正则匹配，
    # 确保 /tools/ 下的 js/css 等从工具目录而非物料系统目录读取。
    location ^~ /tools/ {
        alias /home/tthih/tools/;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # ===== 独立项目：Excel 工具的 Python 后端（预留） =====
    # 以后跑 Flask/FastAPI 监听 127.0.0.1:9000 时启用；未启动时返回 502 属正常。
    location /tools-api/ {
        proxy_pass http://127.0.0.1:9000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 50m;
    }

    # ===== 独立项目：斑马标签打印中心 =====
    # 打印中心仅监听本机 127.0.0.1:8091。
    # ^~ 确保其 js/css 等资源不会被下方物料系统的静态资源规则接管。
    location = /zebra-print {
        return 301 /zebra-print/;
    }

    location ^~ /zebra-print/ {
        proxy_pass http://127.0.0.1:8091/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /zebra-print;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
        client_max_body_size 20m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    location /api/ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/actuator/ {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 大批量数据导入：上传体积大且需逐行落库，耗时远超普通接口，单独放宽超时并关闭请求体缓冲
    location /api/imports/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
