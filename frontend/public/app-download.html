<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>APP 下载 · 物料拉动系统</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      color: #e7ecf5;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(ellipse 80% 60% at 15% 20%, rgba(37, 99, 235, 0.45), transparent 55%),
        radial-gradient(ellipse 70% 50% at 85% 80%, rgba(6, 182, 212, 0.28), transparent 50%),
        linear-gradient(145deg, #0b1220 0%, #111827 42%, #0f172a 100%);
    }
    .card {
      width: 100%;
      max-width: 420px;
      padding: 36px 32px 30px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.97);
      color: #111827;
      box-shadow: 0 32px 64px rgba(0, 0, 0, 0.28);
      text-align: center;
    }
    .logo {
      width: 56px; height: 56px; margin: 0 auto 16px;
      border-radius: 18px;
      background: linear-gradient(135deg, #3b82f6, #06b6d4);
      color: #fff; font-weight: 900; font-size: 20px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 12px 28px rgba(37, 99, 235, 0.3);
    }
    h1 { font-size: 22px; font-weight: 800; margin-bottom: 6px; }
    .sub { color: #667085; font-size: 14px; margin-bottom: 24px; }
    .meta {
      text-align: left;
      background: #f8fafc;
      border: 1px solid #e7eaf0;
      border-radius: 14px;
      padding: 16px 18px;
      margin-bottom: 20px;
      font-size: 14px;
      line-height: 2;
      color: #344054;
    }
    .meta b { color: #111827; }
    .meta .notes { color: #667085; font-size: 13px; }
    .dl-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; height: 50px;
      border-radius: 12px; border: none; cursor: pointer;
      font-size: 16px; font-weight: 700; letter-spacing: 1px;
      color: #fff; text-decoration: none;
      background: linear-gradient(135deg, #2563eb, #0ea5e9);
      box-shadow: 0 14px 28px rgba(37, 99, 235, 0.32);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .dl-btn:hover { transform: translateY(-1px); box-shadow: 0 18px 32px rgba(37, 99, 235, 0.4); }
    .dl-btn.disabled { background: #cbd5e1; box-shadow: none; cursor: not-allowed; pointer-events: none; }
    .hint {
      margin-top: 18px; font-size: 12px; line-height: 1.8; color: #94a3b8;
      text-align: left;
      padding-top: 16px; border-top: 1px solid #eef1f5;
    }
    .sha { word-break: break-all; font-family: monospace; font-size: 11px; color: #94a3b8; }
    .back { display: block; margin-top: 18px; font-size: 13px; color: #2563eb; text-decoration: none; }
    .back:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">MP</div>
    <h1>扫码枪 APP 下载</h1>
    <p class="sub">物料拉动系统 · 安卓客户端</p>

    <div class="meta" id="meta">正在读取版本信息…</div>

    <a class="dl-btn disabled" id="dlBtn" href="#">下载 APK</a>

    <div class="hint">
      <div>· 请用安卓设备（扫码枪）打开本页面下载安装。</div>
      <div>· 首次安装需在系统提示时允许「安装未知应用」。</div>
      <div>· 升级安装要求与已装版本使用相同签名。</div>
      <div id="shaLine" class="sha"></div>
    </div>

    <a class="back" href="/">← 返回登录</a>
  </div>

  <script src="/app-download.js"></script>
</body>
</html>
